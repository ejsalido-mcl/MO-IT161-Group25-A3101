<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetGuard - Choose Your Password</title>
    <link rel="icon" href="images/shield.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-md bg-white border-bottom sticky-top">
            <div class="container">
                <a href="index.html" class="navbar-brand brand">
                    <img src="images/shield.svg" alt="" class="brand-icon">
                    <span>NetGuard <small class="brand-tag">Admin</small></span>
                </a>
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <span id="signed-in-as" class="small text-body-secondary"></span>
                    <button id="logout-button" type="button" class="btn btn-sm btn-outline-secondary">Log out</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="auth border-0">
            <div class="row justify-content-center">
                <div class="col-sm-10 col-md-7 col-lg-5">
                    <div class="card auth-card"><div class="card-body p-4 p-md-5">
                        <img src="images/shield.svg" alt="" class="auth-icon">
                        <h1>Choose your password</h1>
                        <p id="password-intro" class="text-body-secondary">
                            You're signed in with the shared starting password. Choose your own
                            password to open the admin dashboard.
                        </p>
                        <form id="first-password-form" novalidate>
                            <div class="mb-3">
                                <label for="fp-current" class="form-label">Current password:</label>
                                <input type="password" class="form-control" id="fp-current" autocomplete="current-password" maxlength="128" placeholder="The password you just logged in with">
                            </div>
                            <div class="mb-3">
                                <label for="fp-new" class="form-label">New password:</label>
                                <input type="password" class="form-control" id="fp-new" autocomplete="new-password" maxlength="128" placeholder="At least 8 characters">
                                <div class="form-text">At least 8 characters, not containing your username.</div>
                            </div>
                            <div class="mb-4">
                                <label for="fp-confirm" class="form-label">Type the new password again:</label>
                                <input type="password" class="form-control" id="fp-confirm" autocomplete="new-password" maxlength="128">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save password and continue</button>
                        </form>
                        <div id="fp-error" class="alert alert-danger mt-3 mb-0" role="alert" style="display: none;"></div>
                    </div></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <p>Contact: support@netguard.com</p>
            <p>&copy; 2026 NetGuard. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
