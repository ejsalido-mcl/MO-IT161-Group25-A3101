<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetGuard – Admin Login</title>
    <link rel="icon" href="images/shield.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-md bg-white border-bottom sticky-top">
            <div class="container">
                <a href="index.html" class="navbar-brand brand">
                    <img src="images/shield.svg" alt="" class="brand-icon">
                    <span>NetGuard</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="main-nav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="assessment.html">Start Assessment</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="auth border-0">
            <div class="row justify-content-center">
                <div class="col-sm-10 col-md-7 col-lg-5">
                    <div class="card auth-card"><div class="card-body p-4 p-md-5">
                        <img src="images/shield.svg" alt="" class="auth-icon">
                        <h1>Admin Login</h1>
                        <p class="text-body-secondary">Log in to view messages and assessment results.</p>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="admin-username" class="form-label">Username:</label>
                                <input type="text" class="form-control" id="admin-username" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
                            </div>
                            <div class="mb-4">
                                <label for="admin-password" class="form-label">Password:</label>
                                <input type="password" class="form-control" id="admin-password" placeholder="Enter your password" autocomplete="current-password" maxlength="128" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Log In</button>
                        </form>
                        <div id="login-error" class="alert alert-danger mt-3 mb-0" role="alert" style="display: none;"></div>
                    </div></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container text-center">
            <p>Contact: support@netguard.com</p>
            <p>&copy; 2026 NetGuard. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
